title: Farkle # name of the site
author: Davide Pessi # name of site's author
description: Regole del Farkle
url: https://davidepessi.github.io # root address of the site
baseurl: /Farkle

permalink: /:slug.html

theme: jekyll-theme-merlot

exclude:
  - download

plugins:
  - jemoji
  - jekyll-feed
  - jekyll-seo-tag
  # enabled by default on GitHub Pages, listed here so local previews match
  - jekyll-optional-front-matter
  - jekyll-readme-index
  - jekyll-default-layout
  - jekyll-relative-links
